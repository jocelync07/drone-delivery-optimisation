name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # let every Python version report, even if one fails
      matrix:
        python-version: ["3.10", "3.13"]  # Ubuntu 26.04 runners start at 3.10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: pytest -v
      - name: Quick run of all experiments
        run: python experiments.py --quick
